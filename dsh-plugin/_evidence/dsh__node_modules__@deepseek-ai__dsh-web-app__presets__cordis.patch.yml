107:                   toolName: subagent_codex
108:                   backgroundMode: one-shot
109:                   maxDepth: provider-managed
110:               - id: tool-subagent-claude-code
111:                 name: '@deepseek-ai/dsh-tool-subagent'
112:                 disabled: true
113:                 config:
114:                   provider: claude-code
115:                   toolName: subagent_claude_code
116:                   backgroundMode: one-shot
117:                   maxDepth: provider-managed
118:               - id: workflow-ptc
119:                 name: '@deepseek-ai/dsh-workflow-ptc'
120:                 config: