1: # Agent preset cordis: one `@deepseek-ai/dsh-agent-preset` declaration inserted
2: # after the web patch. Edits saved from the Web editor override this row's
3: # `config.plugins` by id from the profile patch.
4: - insert:
5:     - id: preset-cordis
6:       name: '@deepseek-ai/dsh-agent-preset'
7:       config:
8:         id: cordis
9:         order: 4
10:         plugins:
11:           # Same persona as `standard`: tool descriptions and the skill catalog carry
12:           # the operating detail, and the skills own the preset-authoring rules.
13:           - id: persona
14:             name: '@deepseek-ai/dsh-persona'
15:             config:
16:               suffix: Your working directory is {{cwd}}.
17:               prefix: >-
18:                 You are a coding agent powered by the {{model}} model.
19:           - id: agent-instructions
20:             name: '@deepseek-ai/dsh-agent-instructions'
21:             config:
22:               maxBytes: 65536
23:           - id: tool-bash
24:             name: '@deepseek-ai/dsh-tool-bash'
25:             disabled: !!js process.platform === 'win32'
26:           - id: tool-pwsh
27:             name: '@deepseek-ai/dsh-tool-pwsh'
28:             disabled: !!js process.platform !== 'win32'
29:           - id: tool-fs
30:             name: '@deepseek-ai/dsh-tool-fs'
31:           - id: tool-fs-search
32:             name: '@deepseek-ai/dsh-tool-fs-search'
33:             config:
34:               sampleOverCapGlobResults: false
35:           - id: tool-jobs
36:             name: '@deepseek-ai/dsh-tool-jobs'
37:           - id: command-goal
38:             name: '@deepseek-ai/dsh-command-goal'
39:           - id: tool-goal
40:             name: '@deepseek-ai/dsh-tool-goal'
41:           - id: planning
42:             name: cordis:group
43:             group: true
44:             isolate:
45:               planMode: true
46:             config:
47:               - id: plan-mode
48:                 name: '@deepseek-ai/dsh-plan-mode'
49:                 config:
50:                   section: |
51:                     You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
52: 
53:                     Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.
54: 
55:                     The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.
56: 
57:                     Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.
58: 
59:                     Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.
60: 
61:                     When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
62:           - id: compaction
63:             name: cordis:group
64:             group: true
65:             isolate:
66:               compaction: true
67:               toolResultPruner: true
68:             config:
69:               - id: compaction-basic
70:                 name: '@deepseek-ai/dsh-compaction-basic'
71:               - id: command-compact
72:                 name: '@deepseek-ai/dsh-command-compact'
73:               - id: tool-result-pruner
74:                 name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
75:                 config:
76:                   thresholdChars: 8192
77:                   headChars: 4096
78:                   tailChars: 1024
79:           - id: delegation
80:             name: cordis:group
81:             group: true
82:             isolate:
83:               workflowEngine: true
84:             config:
