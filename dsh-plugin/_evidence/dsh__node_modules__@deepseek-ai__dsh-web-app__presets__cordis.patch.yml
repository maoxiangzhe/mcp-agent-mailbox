89:               - id: tool-subagent
90:                 name: '@deepseek-ai/dsh-tool-subagent'
91:                 config:
92:                   provider: spawn
93:                   toolName: subagent
94:                   modelSelectionSettings: true
95:                   backgroundMode: continuable
96:               - id: tool-subagent-fork
